<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Rounded dark-blue industrial badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1120" stroke="url(#bgGrad)" stroke-width="3" />

  <!-- Corner scanner brackets -->
  <path d="M10 18 V12 H16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M54 18 V12 H48" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M10 46 V52 H16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M54 46 V52 H48" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Barcode bars -->
  <g fill="#f8fafc">
    <rect x="14" y="18" width="3.5" height="28" rx="1" />
    <rect x="20" y="18" width="1.8" height="28" rx="0.8" />
    <rect x="24" y="18" width="4.2" height="28" rx="1" />
    <rect x="31" y="18" width="2" height="28" rx="0.8" />
    <rect x="35.5" y="18" width="3.8" height="28" rx="1" />
    <rect x="42" y="18" width="1.8" height="28" rx="0.8" />
    <rect x="46.5" y="18" width="3.5" height="28" rx="1" />
  </g>

  <!-- Horizontal scanner beam -->
  <rect x="8" y="31" width="48" height="2.4" rx="1.2" fill="url(#laserGrad)" />
</svg>
